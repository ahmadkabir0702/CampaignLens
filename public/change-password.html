<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password · Campaign Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000050;
  --ink-900:#1A1A4F;
  --ink-600:#4A4A75;
  --ink-400:#6B6B90;
  --line:#DCDCE6;
  --white:#FFFFFF;
  --art-bg:#F1EEE9;
  --neg:#A32040;
  --neg-bg:#FBEEF1;
  --r:6px;
  --font:'Rubik',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.2,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:400 15px/22px var(--font);color:var(--ink-900);background:var(--white);-webkit-font-smoothing:antialiased}

/* Full height, no page scroll — the form column scrolls on its own if needed. */
.auth{display:grid;grid-template-columns:58fr 42fr;height:100vh;overflow:hidden}

.art{position:relative;background:var(--art-bg);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}

/* justify-content centres horizontally; margin:auto on .col centres vertically
   but still allows scrolling instead of clipping the top on short screens. */
.side{display:flex;justify-content:center;overflow-y:auto;background:var(--white);padding:28px 40px}
.col{width:100%;max-width:352px;text-align:center;margin:auto 0}

.logo{margin-bottom:30px;display:flex;justify-content:center}
/* The product name, set in type. There is no image logo. */
.logo span{font:500 19px/46px var(--font);letter-spacing:.02em;color:var(--ink-900)}

h1{font:400 26px/34px var(--font);color:var(--ink-900);margin-bottom:6px}
.sub{font-size:15px;line-height:22px;color:var(--ink-600);margin-bottom:24px}

.err{
  display:block;background:var(--neg-bg);color:var(--neg);border-radius:var(--r);
  padding:10px 14px;font-size:14px;line-height:20px;margin-bottom:18px;text-align:left;
}

.field{text-align:left;margin-bottom:14px}
label{display:block;font-size:14px;line-height:20px;color:var(--ink-600);margin-bottom:6px}
input{
  width:100%;height:46px;padding:0 14px;
  background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  font:400 15px/46px var(--font);color:var(--ink-900);
  transition:border-color .15s var(--ease);
}
input::placeholder{color:#A0A0BB}
input:hover{border-color:#C2C2D2}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,0,80,.10)}

.btn{
  width:100%;height:50px;margin-top:10px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--white);border:1px solid var(--navy);border-radius:var(--r);
  font:500 15px/1 var(--font);color:var(--ink-900);cursor:pointer;
  transition:background .15s var(--ease);
}
.btn:hover{background:#F4F4F8}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(0,0,80,.18)}
.btn svg{width:17px;height:17px;flex:none}

.legal{margin-top:18px;font-size:13px;line-height:19px;color:var(--ink-600)}
.legal strong{font-weight:500;color:var(--ink-900)}

.access{
  margin-top:28px;padding-top:20px;border-top:1px solid #EDEDF2;
  font-size:13px;line-height:20px;color:var(--ink-600);
}
.access a{color:var(--ink-900);text-decoration:none;border-bottom:1px solid var(--line)}
.access a:hover{border-bottom-color:var(--ink-400)}

/* Short viewports (laptops, 125–150% Windows scaling) */
@media (max-height:760px){
  .logo{margin-bottom:20px}
  .logo span{font-size:17px;line-height:38px}
  h1{font-size:23px;line-height:30px}
  .sub{margin-bottom:18px}
  .field{margin-bottom:11px}
  input,.btn{height:42px}
  input{line-height:42px}
  .legal{margin-top:14px;font-size:12px;line-height:18px}
  .access{margin-top:20px;padding-top:16px;font-size:12px;line-height:18px}
  .side{padding:20px 40px}
}

@media (max-width:900px){
  .auth{grid-template-columns:1fr;height:auto;min-height:100vh;overflow:visible}
  .art{height:210px}
  .side{padding:36px 24px 48px;overflow:visible}
  .col{margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="auth">

  <div class="art">
    <img src="/img/login-art.jpg" alt="">
  </div>

  <div class="side">
    <div class="col">

      <div class="logo">
        <span>Campaign Lens</span>
      </div>

      <h1>Change password</h1>
      <p class="sub">Signed in as <!-- USERNAME --></p>

      <!-- ERROR_BLOCK -->

      <form method="POST" action="/change-password">
        <div class="field">
          <label for="current">Current password</label>
          <input id="current" type="password" name="current" autocomplete="current-password" required autofocus>
        </div>
        <div class="field">
          <label for="next">New password</label>
          <input id="next" type="password" name="next" autocomplete="new-password" required minlength="10">
        </div>
        <div class="field">
          <label for="confirm">New password again</label>
          <input id="confirm" type="password" name="confirm" autocomplete="new-password" required minlength="10">
        </div>
        <button class="btn" type="submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
          Change password
        </button>
      </form>

      <p class="legal">At least 10 characters. Pick something not used anywhere else.</p>

      <p class="access">
        <!-- SHARED_NOTE -->
      </p>

    </div>
  </div>
</div>

</body>
</html>
