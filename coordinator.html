<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Influencer Stats · Campaign Lens</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink-900: #1A1A4F; --ink-700: #3B3B6B; --ink-500: #6B6B8A; --ink-300: #A8A8BE;
    --line: #E1E0EB; --bg: #F5F5F9; --card: #FFFFFF;
    --good: #1E8A4C; --good-bg: #E8F5EE; --warn: #B7791F; --warn-bg: #FCF3E3;
    --bad: #B3261E; --bad-bg: #FCEBEA; --info: #1877F2; --info-bg: #E8F0FE;
    --font: 'Rubik', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 400 14px/1.5 var(--font); color: var(--ink-900); background: var(--bg); }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 14px 24px;
           display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; }
  header .who { color: var(--ink-500); font-size: 13px; }
  header select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  header a { color: var(--ink-500); font-size: 13px; text-decoration: none; }
  header a:hover { color: var(--ink-900); }
  main { max-width: 1120px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
  .banner { border-radius: 10px; padding: 14px 18px; font-weight: 500; display: none; }
  .banner.show { display: block; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid #F0C4C1; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #F0DDB5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  label { display: block; font-size: 12px; color: var(--ink-500); margin-bottom: 4px; }
  input, select { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--info-bg); border-color: var(--info); }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  button { font: inherit; font-weight: 500; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink-900); }
  button.primary { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; color: var(--ink-500); }
  .msg.ok { color: var(--good); } .msg.err { color: var(--bad); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-weight: 500; color: var(--ink-500); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .id { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .sub { color: var(--ink-500); font-size: 12px; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .badge.done { background: var(--good-bg); color: var(--good); }
  .badge.pending { background: var(--info-bg); color: var(--info); }
  .badge.soon { background: var(--warn-bg); color: var(--warn); }
  .badge.overdue { background: var(--bad-bg); color: var(--bad); }
  .badge.problem { background: var(--bad-bg); color: var(--bad); }
  .badge.syncing { background: var(--info-bg); color: var(--info); }
  .plat.err { background: var(--bad-bg); color: var(--bad); border-color: #F0C4C1; }
  .plat.wait { color: var(--ink-300); }
  .sync-err { margin: 6px 0 0; padding: 12px 14px; background: var(--bad-bg); border: 1px solid #F0C4C1;
              border-radius: 8px; color: var(--bad); font-size: 13px; line-height: 1.45; }
  .sync-err code { font-size: 12px; word-break: break-word; }

  .plats { display: flex; gap: 6px; flex-wrap: wrap; }
  .plat { font-size: 11px; padding: 2px 7px; border-radius: 4px; background: var(--bg); color: var(--ink-700); border: 1px solid var(--line); }
  .plat.has { background: var(--good-bg); color: var(--good); border-color: #C8E6D3; }
  .empty { color: var(--ink-500); padding: 24px; text-align: center; }
  /* stats modal */
  .modal { background: #fff; border-radius: 12px; width: min(860px, 100%); max-height: 92vh; overflow: auto; padding: 22px; }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .tabs { display: flex; gap: 6px; margin: 14px 0; }
  .tab { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; font-weight: 500; }
  .tab.on { background: var(--ink-900); color: #fff; border-color: var(--ink-900); }
  .tab.off { opacity: .45; }
  .cbx-wrap { position: relative; }
  .cbx-list { position: absolute; z-index: 20; left: 0; right: 0; top: 100%; margin-top: 4px;
              background: #fff; border: 1px solid var(--line); border-radius: 8px;
              box-shadow: 0 8px 24px rgba(26,26,79,.10); max-height: 260px; overflow-y: auto;
              display: none; }
  .cbx-list.show { display: block; }
  .cbx-opt { padding: 9px 12px; cursor: pointer; font-size: 13px; }
  .cbx-opt:hover, .cbx-opt.active { background: var(--bg); }
  .cbx-opt .cbx-name { font-weight: 500; }
  .cbx-opt .cbx-plats { font-size: 11px; color: var(--ink-500); margin-top: 2px; }
  .cbx-empty { padding: 12px; font-size: 13px; color: var(--ink-500); }
  .plats-form { margin-top: 14px; display: grid; gap: 10px; }
  .plat-row { display: flex; align-items: center; gap: 12px; }
  .plat-row .plat-name { width: 84px; flex: none; font-size: 13px; color: var(--ink-700); }
  .plat-row input { flex: 1; }
  .plat-row input:disabled { background: var(--bg); color: var(--ink-300); }
  .tgl { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; cursor: pointer; }
  .tgl input { opacity: 0; width: 0; height: 0; position: absolute; }
  .tgl-track { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: background .15s; }
  .tgl-track::before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .15s; }
  .tgl input:checked + .tgl-track { background: var(--ink-900); }
  .tgl input:checked + .tgl-track::before { transform: translateX(16px); }
  .rv { border: 1px solid var(--line); border-radius: 8px; padding: 16px; background: var(--bg); margin-top: 16px; }
  .rv h4 { margin: 0 0 10px; font-size: 13px; }
  .rv-line { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rv-line:last-child { border-bottom: 0; }
  .rv-k { color: var(--ink-500); }
  .rv-v { text-align: right; word-break: break-all; max-width: 62%; }
  .rv-off { color: var(--ink-300); }
  .rv-warn { margin-top: 10px; font-size: 12px; color: var(--warn); }
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  @media (max-width: 640px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
  .plat-err { display: none; margin: -2px 0 4px 96px; font-size: 12px; line-height: 1.4; color: #A32040; }
  .plat-row input.bad, .plat-row input.bad:focus { border-color: #A32040; outline-color: #A32040; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Influencer content</h1>
    <div class="who" id="who"></div>
  </div>
  <div style="display:flex;gap:12px;align-items:center">
    <select id="brandSel" title="Brand"></select>
    <a href="/logout">Sign out</a>
  </div>
</header>

<main>
  <div class="banner bad" id="overdueBanner"></div>

  <section class="card">
    <h2>Add influencer content</h2>
    <div class="grid">
      <div class="cbx-wrap">
        <label>Creator</label>
        <input id="f_creator" autocomplete="off" placeholder="Pick a campaign first" disabled>
        <div id="creatorList" class="cbx-list"></div>
        <input type="hidden" id="f_creator_id">
      </div>
      <div><label>Campaign</label><select id="f_campaign"><option value="" disabled selected>Select campaign</option></select></div>
    </div>
    <div class="plats-form">
      <div class="plat-row">
        <label class="tgl"><input type="checkbox" id="f_ig_on" onchange="platToggle('ig')"><span class="tgl-track"></span></label>
        <div class="plat-name">Instagram</div>
        <input id="f_ig" placeholder="https://www.instagram.com/reel/…" disabled
               onblur="checkOne('ig')" oninput="setErr('ig', '')">
      </div>
      <div class="plat-err" id="f_ig_err"></div>
      <div class="plat-row">
        <label class="tgl"><input type="checkbox" id="f_fb_on" onchange="platToggle('fb')"><span class="tgl-track"></span></label>
        <div class="plat-name">Facebook</div>
        <input id="f_fb" placeholder="https://www.facebook.com/…" disabled
               onblur="checkOne('fb')" oninput="setErr('fb', '')">
      </div>
      <div class="plat-err" id="f_fb_err"></div>
      <div class="plat-row">
        <label class="tgl"><input type="checkbox" id="f_tt_on" onchange="platToggle('tt')"><span class="tgl-track"></span></label>
        <div class="plat-name">TikTok</div>
        <input id="f_tt" placeholder="TikTok video link" disabled
               onblur="checkOne('tt')" oninput="setErr('tt', '')">
      </div>
      <div class="plat-err" id="f_tt_err"></div>
      <div class="sub">Turn on every platform this content went live on. A platform left off is recorded as not used.</div>
    </div>
    <div id="review" style="display:none"></div>
    <div class="row">
      <button class="primary" id="addBtn">Review</button>
      <button id="backBtn" style="display:none">Back</button>
      <span class="msg" id="addMsg">Turn on each platform this went live on, then review before submitting.</span>
    </div>
  </section>

  <section class="card">
    <h2>Your content <span class="sub" id="countSub"></span></h2>
    <div id="list"></div>
  </section>
</main>

<script src="/js/links.js"></script>
<script>
const $ = id => document.getElementById(id);
const PLAT = { ig: 'Instagram', fb: 'Facebook', tt: 'TikTok' };
// After this long with no data and no logged error, something is wrong even
// if the sync has not said so. First sync normally lands within 30 minutes;
// Instagram posts still being classified can take about an hour.
const PROBLEM_AFTER_H = 6;
let CREATIVES = [], BRAND = null;

// ── boot ──────────────────────────────────────────────────────────────────
(async function boot() {
  const b = await fetch('/api/brands').then(r => r.json());
  $('who').textContent = b.user.displayName;
  b.brands.forEach(x => {
    const o = document.createElement('option'); o.value = x.brand_id; o.textContent = x.name;
    if (x.brand_id === b.active) o.selected = true;
    $('brandSel').appendChild(o);
  });
  BRAND = b.active || (b.brands[0] && b.brands[0].brand_id);
  await loadCampaigns();
  $('brandSel').style.display = b.brands.length > 1 ? '' : 'none';
  $('brandSel').onchange = async e => {
    BRAND = e.target.value;
    await fetch('/api/switch-brand', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ brand: BRAND }) });
    await loadCampaigns();
    load();
  };
  load();
  setInterval(load, 60000); // countdown stays honest without a refresh
})();

// ── campaigns ─────────────────────────────────────────────────────────────
async function loadCampaigns() {
  const sel = $('f_campaign');
  sel.innerHTML = '<option value="" disabled selected>Select campaign</option>';
  try {
    const list = await fetch('/api/campaigns?brand=' + encodeURIComponent(BRAND)).then(r => r.json());
    (Array.isArray(list) ? list : []).forEach(c => {
      const o = document.createElement('option');
      o.value = c.name;                       // the creative stores the name
      o.dataset.id = c.id == null ? '' : c.id; // the id scopes the creator list
      o.textContent = c.name;
      sel.appendChild(o);
    });
    if (!list.length) sel.innerHTML = '<option value="" disabled selected>No campaigns set up for this brand</option>';
  } catch (e) {
    sel.innerHTML = '<option value="" disabled selected>Could not load campaigns</option>';
  }
}

// ── creator picker ────────────────────────────────────────────────────────
// Creators are scoped to the campaign, so the campaign must be chosen first.
// The list is a filtered combobox rather than a plain select: with a few
// hundred creators a native dropdown is unusable without search.
let CREATORS = [], CREATOR_IDX = -1;

$('f_campaign').addEventListener('change', loadCreators);

async function loadCreators() {
  const opt = $('f_campaign').selectedOptions[0];
  const campaignId = opt ? opt.dataset.id : '';
  const inp = $('f_creator');
  CREATORS = []; $('f_creator_id').value = ''; inp.value = '';

  if (!campaignId) {
    inp.disabled = true;
    inp.placeholder = 'No creators are assigned to this campaign';
    return;
  }
  inp.disabled = false; inp.placeholder = 'Loading creators…';
  try {
    CREATORS = await fetch('/api/creators?brand=' + encodeURIComponent(BRAND) +
                           '&campaign_id=' + encodeURIComponent(campaignId)).then(r => r.json());
    inp.placeholder = CREATORS.length
      ? `Search ${CREATORS.length} creator${CREATORS.length > 1 ? 's' : ''}…`
      : 'No creators are assigned to this campaign';
    inp.disabled = !CREATORS.length;
  } catch (e) {
    inp.disabled = true; inp.placeholder = 'Could not load creators';
  }
}

const PLAT_SHORT = { ig: 'Instagram', fb: 'Facebook', tt: 'TikTok', yt: 'YouTube', other: 'Other' };

function renderCreatorList(filter) {
  const box = $('creatorList');
  const q = (filter || '').trim().toLowerCase();
  const hits = q ? CREATORS.filter(c => c.name.toLowerCase().includes(q)) : CREATORS;
  if (!hits.length) {
    box.innerHTML = `<div class="cbx-empty">${q ? 'No creator matches that name.' : 'No creators assigned.'}</div>`;
  } else {
    box.innerHTML = hits.map((c, i) => {
      const plats = (c.profiles || []).map(p => PLAT_SHORT[p.platform] || p.platform).join(' · ');
      return `<div class="cbx-opt${i === CREATOR_IDX ? ' active' : ''}" data-id="${c.id}" data-name="${esc(c.name)}">
                <div class="cbx-name">${esc(c.name)}</div>
                ${plats ? `<div class="cbx-plats">${esc(plats)}</div>` : ''}
              </div>`;
    }).join('');
    [...box.querySelectorAll('.cbx-opt')].forEach(el => {
      el.onmousedown = ev => {            // mousedown: fires before blur
        ev.preventDefault();
        pickCreator(el.dataset.id, el.dataset.name);
      };
    });
  }
  box.classList.add('show');
}

function pickCreator(id, name) {
  $('f_creator_id').value = id;
  $('f_creator').value = name;
  $('creatorList').classList.remove('show');
  CREATOR_IDX = -1;
}

$('f_creator').addEventListener('input', e => {
  $('f_creator_id').value = '';   // typing invalidates the previous pick
  CREATOR_IDX = -1;
  renderCreatorList(e.target.value);
});
$('f_creator').addEventListener('focus', e => { if (CREATORS.length) renderCreatorList(e.target.value); });
$('f_creator').addEventListener('blur', () => setTimeout(() => $('creatorList').classList.remove('show'), 120));
$('f_creator').addEventListener('keydown', e => {
  const opts = [...$('creatorList').querySelectorAll('.cbx-opt')];
  if (!opts.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); CREATOR_IDX = Math.min(CREATOR_IDX + 1, opts.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); CREATOR_IDX = Math.max(CREATOR_IDX - 1, 0); }
  else if (e.key === 'Enter' && CREATOR_IDX >= 0) {
    e.preventDefault();
    const el = opts[CREATOR_IDX];
    return pickCreator(el.dataset.id, el.dataset.name);
  } else if (e.key === 'Escape') { return $('creatorList').classList.remove('show'); }
  else return;
  opts.forEach((o, i) => o.classList.toggle('active', i === CREATOR_IDX));
  opts[CREATOR_IDX].scrollIntoView({ block: 'nearest' });
});

// ── list ──────────────────────────────────────────────────────────────────
// State of one platform on one creative.
//   synced   the sync has written numbers for it
//   error    no numbers, and the sync logged a failure
//   waiting  no numbers, nothing logged yet
function platState(c, p) {
  const st = (c.stats || []).find(x => x.platform === p);
  if (st && (st.views != null || st.likes != null || st.comments != null)) return 'synced';
  if ((c.errors || []).some(e => e.platform === p)) return 'error';
  return 'waiting';
}

function linksOf(c) { return ['ig', 'fb', 'tt'].filter(p => c[p + '_link']); }

function status(c) {
  const links = linksOf(c);
  if (!links.length) return { k: 'problem', label: 'No links' };
  const h = Number(c.hours_since_upload) || 0;
  const states = links.map(p => platState(c, p));
  if (states.includes('error')) return { k: 'problem', label: 'Not syncing' };
  if (states.includes('waiting')) {
    return h >= PROBLEM_AFTER_H
      ? { k: 'problem', label: 'Not syncing' }
      : { k: 'syncing', label: 'Syncing' };
  }
  return { k: 'done', label: 'Synced' };
}
function fmtH(h) { return h < 1 ? `${Math.round(h * 60)}m` : `${Math.round(h)}h`; }
const ORDER = { problem: 0, syncing: 1, done: 2 };

async function load() {
  const r = await fetch('/api/others-say-pending?brand=' + encodeURIComponent(BRAND));
  if (!r.ok) { $('list').innerHTML = `<div class="empty">Could not load (${r.status}).</div>`; return; }
  CREATIVES = await r.json();
  CREATIVES.forEach(c => c._s = status(c));
  CREATIVES.sort((a, b) => ORDER[a._s.k] - ORDER[b._s.k] || new Date(b.created_at) - new Date(a.created_at));

  const problems = CREATIVES.filter(c => c._s.k === 'problem').length;
  $('overdueBanner').className = 'banner bad' + (problems ? ' show' : '');
  $('overdueBanner').textContent = problems
    ? `${problems} piece${problems > 1 ? 's' : ''} of content ${problems > 1 ? 'are' : 'is'} not syncing. The reason is shown on each. Usually the post was deleted, made private, or the link is wrong.`
    : '';
  $('countSub').textContent = CREATIVES.length ? `· ${CREATIVES.length} total, ${CREATIVES.filter(c => c._s.k === 'done').length} done` : '';

  if (!CREATIVES.length) { $('list').innerHTML = '<div class="empty">Nothing yet. Add content above.</div>'; return; }
  $('list').innerHTML = `<table><thead><tr>
      <th>Creative</th><th>Creator</th><th>Posted</th><th>Uploaded</th><th>Status</th><th>Sync</th>
    </tr></thead><tbody>` + CREATIVES.map(c => {
      const links = linksOf(c);
      return `<tr>
        <td><div class="id">${esc(c.creative_id)}</div><div class="sub">${esc(c.campaign || '')}${c.format ? ' · ' + esc(c.format.replace('_', ' ')) : ''}</div></td>
        <td>${esc(c.creator_handle ? '@' + c.creator_handle : (c.creator_profile || '—'))}</td>
        <td>${c.date ? fmtD(c.date) : '—'}</td>
        <td>${fmtDT(c.created_at)}</td>
        <td><span class="badge ${c._s.k}">${c._s.label}</span></td>
        <td><div class="plats">${links.map(p => {
          const st = platState(c, p);
          const cls = st === 'synced' ? 'has' : st === 'error' ? 'err' : 'wait';
          const mark = st === 'synced' ? ' ✓' : st === 'error' ? ' failed' : '';
          return `<span class="plat ${cls}">${PLAT[p]}${mark}</span>`;
        }).join('') || '<span class="sub">no links</span>'}</div>${
          c._s.k === 'problem' && (c.errors || []).length
            ? (c.errors || []).map(e => `<div class="sync-err"><b>${PLAT[e.platform] || e.platform}:</b> <code>${esc(e.error)}</code></div>`).join('')
            : ''}</td>

      </tr>`;
    }).join('') + '</tbody></table>';
}

// ── add content ───────────────────────────────────────────────────────────
// A link field is only editable when its toggle is on, and then it is
// required. Turning a platform off is a deliberate "not used", which is
// different from leaving a box blank by accident.
const PLATS = [ {k:'ig',label:'Instagram'}, {k:'fb',label:'Facebook'}, {k:'tt',label:'TikTok'} ];
let REVIEWED = false;

// The checkbox is the single source of truth for whether a link field is
// editable, so no reset path can leave a toggle on with its box disabled.
function syncPlatFields() {
  PLATS.forEach(p => {
    const box = $('f_' + p.k + '_on'), inp = $('f_' + p.k);
    if (!box || !inp) return;
    inp.disabled = !box.checked;
    if (!box.checked) inp.value = '';
  });
}

function platToggle(k) {
  syncPlatFields();
  const box = $('f_' + k + '_on'), inp = $('f_' + k);
  if (box && box.checked && inp) inp.focus();
}

function readForm() {
  const plats = {};
  PLATS.forEach(p => plats[p.k] = {
    on: $('f_' + p.k + '_on').checked,
    link: $('f_' + p.k).value.trim(),
    label: p.label,
  });
  return {
    creator: $('f_creator').value.trim(),
    creatorId: $('f_creator_id').value || null,
    campaign: $('f_campaign').value,
    plats,
  };
}

function validate(f) {
  if (!f.campaign) return 'Select a campaign.';
  if (!f.creatorId) return 'Pick a creator from the list. If they are missing, they need assigning to this campaign first.';
  if (!PLATS.some(p => f.plats[p.k].on)) return 'Turn on at least one platform. Content with no links cannot have stats.';
  let bad = false;
  for (const p of PLATS) {
    const v = f.plats[p.k];
    if (!v.on) { setErr(p.k, ''); continue; }
    if (!v.link) { setErr(p.k, 'Add the link or turn this platform off.'); bad = true; continue; }
    const r = window.CLLinks.validate(p.k, v.link);
    if (!r.ok && !r.needsResolve) { setErr(p.k, r.error); bad = true; }
    else setErr(p.k, '');
  }
  return bad ? 'Fix the highlighted links.' : null;
}

function setErr(k, msg) {
  const el = $('f_' + k + '_err'), inp = $('f_' + k);
  if (el) { el.textContent = msg || ''; el.style.display = msg ? 'block' : 'none'; }
  if (inp) inp.classList.toggle('bad', !!msg);
}

function checkOne(k) {
  const box = $('f_' + k + '_on'), inp = $('f_' + k);
  if (!box || !box.checked || !inp || !inp.value.trim()) return;
  const r = window.CLLinks.validate(k, inp.value);
  setErr(k, (!r.ok && !r.needsResolve) ? r.error : '');
}

async function serverCheck(f) {
  const body = {};
  PLATS.forEach(p => { if (f.plats[p.k].on) body[p.k] = f.plats[p.k].link; });
  const r = await fetch('/api/check-links', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
  for (const p of PLATS) {
    const res = data.fields && data.fields[p.k];
    setErr(p.k, res && !res.ok ? res.error : '');
    if (res && res.ok && res.url) $('f_' + p.k).value = res.url;
  }
  return !!data.ok;
}

function renderReview(f) {
  const line = (k, v, off) => `<div class="rv-line"><span class="rv-k">${esc(k)}</span><span class="rv-v ${off ? 'rv-off' : ''}">${esc(v)}</span></div>`;
  const off = PLATS.filter(p => !f.plats[p.k].on).length;
  return `<div class="rv"><h4>Check before submitting</h4>
    ${line('Creator', f.creator)}
    ${line('Campaign', f.campaign)}
    ${PLATS.map(p => line(p.label, f.plats[p.k].on ? f.plats[p.k].link : 'Not used', !f.plats[p.k].on)).join('')}
    ${off ? `<div class="rv-warn">${off} platform${off > 1 ? 's' : ''} recorded as not used. Go back if that is wrong.</div>` : ''}
    <div class="rv-warn">Stats for this content are due within 48 hours of submitting.</div>
  </div>`;
}

function setEditMode() {
  REVIEWED = false;
  $('review').style.display = 'none';
  document.querySelectorAll('.grid, .plats-form').forEach(el => el.style.display = '');
  $('backBtn').style.display = 'none';
  $('addBtn').textContent = 'Review';
}

$('backBtn').onclick = () => { setEditMode(); $('addMsg').className = 'msg'; $('addMsg').textContent = 'Turn on each platform this went live on, then review before submitting.'; };

$('addBtn').onclick = async () => {
  const f = readForm();
  const m = $('addMsg'); m.className = 'msg';

  if (!REVIEWED) {
    const err = validate(f);
    if (err) { m.className = 'msg err'; m.textContent = err; return; }
    $('addBtn').disabled = true; m.textContent = 'Checking links…';
    let linksOk = false;
    try { linksOk = await serverCheck(f); }
    catch (e) { m.className = 'msg err'; m.textContent = 'Could not check the links: ' + e.message; }
    finally { $('addBtn').disabled = false; }
    if (!linksOk) {
      if (m.className !== 'msg err') { m.className = 'msg err'; m.textContent = 'Fix the highlighted links.'; }
      return;
    }
    Object.assign(f, readForm());
    $('review').innerHTML = renderReview(f);
    $('review').style.display = 'block';
    document.querySelectorAll('.grid, .plats-form').forEach(el => el.style.display = 'none');
    $('backBtn').style.display = '';
    $('addBtn').textContent = 'Confirm and add';
    m.textContent = 'Check the details above, then confirm.';
    REVIEWED = true;
    return;
  }

  const body = {
    brand_id: BRAND, type: 'Others Say',
    creator: f.creator, creator_id: f.creatorId,
    campaign: f.campaign,
    ig: f.plats.ig.on ? f.plats.ig.link : null,
    fb: f.plats.fb.on ? f.plats.fb.link : null,
    tt: f.plats.tt.on ? f.plats.tt.link : null,
  };
  $('addBtn').disabled = true; m.textContent = 'Submitting…';
  try {
    const r = await fetch('/api/add-creative', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (j.fieldErrors) {
      setEditMode();
      Object.entries(j.fieldErrors).forEach(([k, msg]) => setErr(k, msg));
      throw new Error('Fix the highlighted links.');
    }
    if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);
    m.className = 'msg ok';
    m.textContent = j.queued
      ? 'Queued. The video is being analysed and will appear below in a few minutes. Numbers start syncing on their own within about 30 minutes.'
      : 'Added. Numbers start syncing on their own within about 30 minutes.';
    ['f_creator', 'f_creator_id', 'f_ig', 'f_fb', 'f_tt'].forEach(id => $(id).value = '');
    PLATS.forEach(p => setErr(p.k, ''));
    $('f_campaign').selectedIndex = 0;
    loadCreators();
    PLATS.forEach(p => { $('f_' + p.k + '_on').checked = false; });
    syncPlatFields();
    setEditMode();
    setTimeout(load, 4000);
  } catch (e) { m.className = 'msg err'; m.textContent = e.message; }
  finally { $('addBtn').disabled = false; }
};

// ── stats modal ───────────────────────────────────────────────────────────

// ── utils ─────────────────────────────────────────────────────────────────
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function fmtD(d) { return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); }
function fmtDT(d) { return new Date(d).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
</script>
</body>
